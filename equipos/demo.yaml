# Equipo mínimo de demostración (migrado desde teams/equipo_demo.yaml
# al esquema único tras la convergencia mas/ + core/).
equipo: demo
descripcion: Equipo mínimo de demostración (orquestador, programador y analista)
orquestador: orquestador

agentes:
  - nombre: orquestador
    rol: Interpreta la petición y reparte la tarea
    herramientas:
      - leer_archivo

  - nombre: programador
    rol: Escribe y corrige código
    herramientas:
      - leer_archivo
      - escribir_archivo

  - nombre: analista
    rol: Lee datos y resume resultados (solo lectura)
    herramientas:
      - leer_archivo
